pencollection: 1.0.0

info:
  name: Nexus API Client
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{accessToken}}"
  variables:
    - name: baseUrl
      value: http://localhost:3000/api
    - name: accessToken
      value: ""
    - name: refreshToken
      value: ""
    - name: email
      value: ""
    - name: password
      value: ""
    - name: name
      value: ""
    - name: otp
      value: ""
    - name: companyId
      value: ""
    - name: departmentId
      value: ""
    - name: branchId
      value: ""
    - name: planId
      value: ""
    - name: inviteToken
      value: ""
    - name: sessionId
      value: ""
    - name: studentId
      value: ""
    - name: studentCode
      value: ""
    - name: admissionCodeId
      value: ""
    - name: studentEmail
      value: ""
    - name: studentPassword
      value: ""
    - name: admissionNumber
      value: ""
    - name: staffUserId
      value: ""
    - name: instructorId
      value: ""
    - name: instructorInviteId
      value: ""
    - name: instructorName
      value: ""
    - name: instructorEmail
      value: ""
    - name: instructorCode
      value: ""
    - name: instructorPhone
      value: ""
    - name: instructorBio
      value: ""
    - name: instructorBranchId
      value: ""
    - name: instructorDepartmentId
      value: ""
    - name: instructorStatus
      value: ACTIVE
    - name: statusReason
      value: ""
    - name: search
      value: ""
    - name: page
      value: "1"
    - name: limit
      value: "20"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
