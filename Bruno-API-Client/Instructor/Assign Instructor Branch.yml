info:
  name: Assign Instructor Branch
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/instructors/{{instructorId}}/branches?companyId={{companyId}}"
  body:
    type: json
    data: |-
      {
        "branchId": "{{instructorBranchId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

