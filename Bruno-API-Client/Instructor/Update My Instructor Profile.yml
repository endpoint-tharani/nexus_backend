info:
  name: Update My Instructor Profile
  type: http
  seq: 15

http:
  method: PATCH
  url: "{{baseUrl}}/instructor/me"
  body:
    type: json
    data: |-
      {
        "phone": "{{instructorPhone}}",
        "bio": "{{instructorBio}}",
        "specializations": ["Mathematics"],
        "qualification": "MSc"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

